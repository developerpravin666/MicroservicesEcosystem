# ---------------------------------------------------------------------------
# SINGLE-SERVER DEPLOYMENT: everything — shared infrastructure and all four
# application services — runs on this one Docker host.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# This is the right choice for a small deployment, a demo environment, or a
# single beefy VM: one `docker compose up` brings up Postgres, Redis, RabbitMQ,
# and every service, all talking to each other over the compose-managed
# "ecosystem" network. Scaling later to separate servers doesn't require any
# code change — see docker-compose.<service>.yml for the per-service files
# that deploy the exact same images independently, each pointed at whichever
# host is running the shared infrastructure via environment variables.
# ---------------------------------------------------------------------------
name: microservices-ecosystem

networks:
  ecosystem:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports: [ "5432:5432" ]
    networks: [ ecosystem ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    networks: [ ecosystem ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports: [ "5672:5672", "15672:15672" ]
    networks: [ ecosystem ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  identityservice-api:
    build:
      context: ..
      dockerfile: src/Identity/IdentityService.Api/Dockerfile
    environment:
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=identity_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__TenantDb: Host=postgres;Port=5432;Database=tenant_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Issuer: ${JWT_ISSUER:-microservices-ecosystem}
      Jwt__Audience: ${JWT_AUDIENCE:-microservices-ecosystem-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ ecosystem ]

  inventoryservice-api:
    build:
      context: ..
      dockerfile: src/Services/InventoryService/InventoryService.Api/Dockerfile
    environment:
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=inventory_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Issuer: ${JWT_ISSUER:-microservices-ecosystem}
      Jwt__Audience: ${JWT_AUDIENCE:-microservices-ecosystem-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ ecosystem ]

  apigateway:
    build:
      context: ..
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    ports: [ "8080:8080" ]
    depends_on: [ identityservice-api, inventoryservice-api ]
    networks: [ ecosystem ]
