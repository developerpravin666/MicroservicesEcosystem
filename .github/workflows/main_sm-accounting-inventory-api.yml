# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - sm-accounting-inventory-api

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: sm-accounting-inventory-api-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore AccountingInventory.Api dependencies
        run: dotnet restore src/AccountingInventory/AccountingInventory.Api/AccountingInventory.Api.csproj -r linux-x64

      - name: Publish AccountingInventory.Api (Self-Contained Linux x64)
        run: |
          dotnet publish src/AccountingInventory/AccountingInventory.Api/AccountingInventory.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            --output "${{ runner.temp }}/accounting-api-publish"

      - name: Prepare production package
        shell: pwsh
        run: |
          $publishDirectory = Join-Path '${{ runner.temp }}' 'accounting-api-publish'
          Get-ChildItem -LiteralPath $publishDirectory -Filter 'appsettings.Development.json' -File | Remove-Item -ErrorAction SilentlyContinue
          if (-not (Test-Path -LiteralPath (Join-Path $publishDirectory 'AccountingInventory.Api.dll'))) {
            throw 'The AccountingInventory.Api publish output is missing.'
          }

      - name: Set Linux binary permissions
        run: |
          chmod +x "${{ runner.temp }}/accounting-api-publish/AccountingInventory.Api" || true

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sm-accounting-inventory-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3433A9E4D5C6408AB9012C275464F43E || secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ${{ runner.temp }}/accounting-api-publish